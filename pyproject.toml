[project]
name = "leviathan-api"
version = "1.0.0"
description = "FastAPI Stripe auth checker"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "PySocks==1.7.1"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
